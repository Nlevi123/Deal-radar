<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d4f8b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Deal Radar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--blue:#0d4f8b;--blue2:#1a6fc2;--bg:#eef1f4;--card:#fff;--ink:#1c1f23;--mute:#6b7280;--line:#e3e6ea;--red:#d0212d;--green:#127a3e;--purple:#6d28d9;--orange:#e8590c}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{background:var(--blue);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1000px;margin:auto}
.logo{font-weight:900;font-size:20px;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:6px}
.logo i{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid #fff;position:relative}
.logo i:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#ff5a5f}
.search{flex:1;display:flex;align-items:center;background:#fff;border-radius:6px;padding:0 10px;height:36px;color:var(--ink)}
.search input{border:0;outline:0;flex:1;font-size:15px;background:transparent;margin-left:6px}
.tabs{display:flex;overflow-x:auto;max-width:1000px;margin:auto;padding:0 8px;scrollbar-width:none;background:var(--blue)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:#cfe0f3;font-weight:700;font-size:14px;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:#fff;border-bottom-color:#ffd43b}
.bar{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font-size:13px;color:var(--mute);gap:10px}
.bar b{color:var(--ink);font-size:15px}
select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;color:var(--ink)}
.list{max-width:1000px;margin:auto;padding:0 8px 80px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border-radius:10px;display:flex;gap:12px;padding:10px;position:relative;border:1px solid var(--line);transition:opacity .2s,transform .2s}
.row.gone{opacity:0;transform:translateX(30px)}
.thumb{flex:none;width:104px;height:104px;border-radius:8px;background:#fff;border:1px solid #f0f1f3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-right:26px}
.ttl{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.now{color:var(--red);font-weight:800;font-size:18px}
.was{color:var(--mute);text-decoration:line-through;font-size:13px}
.off{font-size:12px;font-weight:800;color:#fff;background:var(--red);padding:1px 6px;border-radius:4px}
.off.big{background:var(--purple)}
.meta{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.store{font-weight:700;color:var(--blue2)}
.ok{color:var(--green);font-weight:700}
.sz{display:flex;gap:4px;flex-wrap:wrap}
.sz span{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink);background:#f8f9fa}
.ret{font-size:11px;color:var(--mute)}
.x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:#f1f3f5;color:#555;font-size:15px;cursor:pointer}
.hot{position:absolute;left:10px;top:10px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:4px;text-transform:uppercase}
.more{margin:8px auto 0;display:block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 18px;font-weight:700;color:var(--blue2);cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:50px 20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:#222;color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;display:flex;gap:14px;transition:transform .25s;z-index:30}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:0;color:#ffd43b;font-weight:800;cursor:pointer;font-size:14px}
.trow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:10px}
.trow .n{font-weight:600}.trow .s{font-size:12px;color:var(--mute)}.trow .p{font-weight:800;text-align:right}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo"><i></i>DealRadar</div>
    <label class="search">&#128269;<input id="q" type="search" placeholder="Search brands, items, stores" autocomplete="off"></label>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="bar"><div><b id="count">Loading…</b> <span id="upd"></span></div>
  <select id="sort"><option value="new">Newest</option><option value="pct">Biggest % off</option><option value="low">Lowest price</option><option value="save">Biggest $ saved</option></select>
</div>
<main class="list" id="main"></main>
<div class="toast" id="toast"><span>Removed</span><button id="undo">UNDO</button></div>
<script>
const TABS=[["all","Frontpage"],["menswear","Designer clothing"],["shoes","Shoes"],["glitch","Price mistakes"],["tech","Tech"],["other","Everything else"],["tracker","Price tracker"],["removed","Removed"]];
const BLOCK=["ebay","adidas"];const PAGE=60;
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let deals=[],tracked={},tab=ls.get("dr_tab","all"),sort=ls.get("dr_sort","new"),q="",shown=PAGE,last=null,tt;
let removed=new Set(ls.get("dr_removed",[]));
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n==null?"":"$"+(n%1?n.toFixed(2):Number(n).toLocaleString());
function ago(iso){if(!iso)return"";const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.round(m/60);return h<24?h+"h ago":Math.round(h/24)+"d ago"}
function tabs(){$("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===tab?"on":""}" data-t="${k}">${l}</button>`).join("")}
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;ls.set("dr_tab",t);shown=PAGE;tabs();render();scrollTo({top:0})};
$("q").oninput=e=>{q=e.target.value.toLowerCase().trim();shown=PAGE;render()};
$("sort").value=sort;$("sort").onchange=e=>{sort=e.target.value;ls.set("dr_sort",sort);shown=PAGE;render()};
const blocked=d=>{const s=(d.title+" "+(d.store||"")+" "+(d.url||"")).toLowerCase();return BLOCK.some(b=>s.includes(b))};
function list(){
  let l=deals.filter(d=>!blocked(d));
  if(tab==="removed")l=l.filter(d=>removed.has(d.id));
  else{l=l.filter(d=>!removed.has(d.id));
    if(tab==="glitch")l=l.filter(d=>d.tier==="glitch");
    else if(tab==="other")l=l.filter(d=>!["menswear","shoes","tech"].includes(d.cat));
    else if(tab!=="all")l=l.filter(d=>d.cat===tab);}
  if(q)l=l.filter(d=>(d.title+" "+(d.store||"")+" "+(d.brand||"")).toLowerCase().includes(q));
  const f={new:(a,b)=>new Date(b.foundAt)-new Date(a.foundAt),pct:(a,b)=>(b.pct||0)-(a.pct||0),low:(a,b)=>(a.price||1e9)-(b.price||1e9),save:(a,b)=>((b.was||0)-(b.price||0))-((a.was||0)-(a.price||0))}[sort];
  return l.sort(f);
}
function row(d){
  const rm=tab==="removed";
  return `<article class="row" id="r-${d.id}">
   <a class="thumb" href="${esc(d.url)}" target="_blank" rel="noopener">${d.img?`<img loading="lazy" src="${esc(d.img)}" alt="" onerror="this.remove()">`:"🏷️"}</a>
   ${d.tier==="glitch"?'<span class="hot">Mistake</span>':""}
   <a class="info" href="${esc(d.url)}" target="_blank" rel="noopener">
     <div class="ttl">${esc(d.title)}</div>
     <div class="pr">${d.price?`<span class="now">${money(d.price)}</span>`:""}${d.was?`<span class="was">${money(d.was)}</span>`:""}${d.pct?`<span class="off ${d.pct>=60?"big":""}">${d.pct}% off</span>`:""}</div>
     <div class="meta"><span class="store">${esc(d.store||d.source)}</span>${d.verified?`<span class="ok">✓ Price checked ${ago(d.verified)}</span>`:""}<span>· ${ago(d.foundAt)}</span></div>
     ${d.sizes&&d.sizes.length?`<div class="sz">${d.sizes.map(s=>`<span>${esc(s)}</span>`).join("")}</div>`:""}
     ${d.returns?`<div class="ret">↩ ${esc(d.returns)}</div>`:""}
   </a>
   <button class="x" data-id="${d.id}" aria-label="${rm?"Restore":"Remove"}">${rm?"↺":"✕"}</button>
  </article>`}
function render(){
  const m=$("main");
  if(tab==="tracker"){const rows=Object.entries(tracked).filter(([k])=>!k.startsWith("_"));$("count").textContent=rows.length+" tracked";
    m.innerHTML=rows.map(([u,t])=>`<a class="trow" href="${esc(u)}" target="_blank" rel="noopener"><div><div class="n">${esc(t.name)}</div><div class="s">${t.error?esc(t.error):"Low "+money(t.low)+" · checked "+ago(t.checkedAt)}</div></div><div class="p">${money(t.last)||"—"}</div></a>`).join("")||'<div class="empty">Nothing tracked yet.</div>';return}
  const l=list();$("count").textContent=`${l.length} ${tab==="removed"?"removed":"deals"}`;
  m.innerHTML=l.length?l.slice(0,shown).map(row).join("")+(l.length>shown?`<button class="more" id="more">Show more (${l.length-shown} left)</button>`:""):`<div class="empty">${tab==="removed"?"Nothing removed.":"No deals here right now. New ones arrive every few minutes."}</div>`;
}
$("main").addEventListener("click",e=>{
  if(e.target.id==="more"){shown+=PAGE;render();return}
  const b=e.target.closest(".x");if(!b)return;e.preventDefault();
  const id=b.dataset.id,r=$("r-"+id),back=removed.has(id);
  back?removed.delete(id):removed.add(id);ls.set("dr_removed",[...removed]);
  r.classList.add("gone");setTimeout(render,200);
  if(!back){last=id;$("toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("show"),4000)}
});
$("undo").onclick=()=>{if(last){removed.delete(last);ls.set("dr_removed",[...removed]);last=null;render()}$("toast").classList.remove("show")};
async function load(){
  try{const[a,b]=await Promise.all([fetch("deals.json?"+Date.now()).then(r=>r.json()),fetch("tracked.json?"+Date.now()).then(r=>r.json()).catch(()=>({}))]);
    deals=a.deals||[];tracked=b;$("upd").textContent="· updated "+ago(a.updatedAt)}catch(e){$("upd").textContent="· couldn't load"}
  render()}
tabs();load();setInterval(load,120000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
