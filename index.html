<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Deal Radar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#141414;--mute:#6f6b66;--line:#e7e4df;--sale:#d6232f;--glitch:#7a2cf0;--fire:#e8590c;--good:#1d7a46;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.promo{background:var(--ink);color:#fff;text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px}
header{position:sticky;top:0;z-index:20;background:rgba(246,245,242,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;max-width:1200px;margin:auto}
.logo{font-weight:800;font-size:22px;letter-spacing:-.03em;white-space:nowrap}
.logo span{color:var(--sale)}
.search{flex:1;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px}
.search input{border:0;outline:0;flex:1;font-size:15px;background:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;max-width:1200px;margin:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.meta{max-width:1200px;margin:auto;padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;color:var(--mute);font-size:13px}
.meta b{color:var(--ink);font-size:17px}
.grid{max-width:1200px;margin:auto;padding:10px 12px 90px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .25s,opacity .25s}
.card.gone{transform:scale(.9);opacity:0}
.ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #f1efeb;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;padding:10px}
.ph .noimg{font-size:40px;opacity:.25}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:4px 8px;border-radius:6px}
.b-glitch{background:var(--glitch)}.b-fire{background:var(--fire)}.b-good{background:var(--good)}
.x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:17px;line-height:30px;cursor:pointer;color:#444}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.store{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.title{font-size:14px;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prices{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.now{font-size:18px;font-weight:800;color:var(--sale)}
.was{font-size:13px;color:var(--mute);text-decoration:line-through}
.off{font-size:12px;font-weight:800;color:var(--sale);background:#fde8e9;padding:2px 6px;border-radius:5px}
.foot{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;font-size:14px;display:flex;gap:16px;align-items:center;transition:transform .25s;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:0;color:#ffd43b;font-weight:800;font-size:14px;cursor:pointer}
.tlist{max-width:800px;margin:auto;padding:10px 16px 90px;display:flex;flex-direction:column;gap:10px}
.trow{background:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.trow .n{font-weight:600;font-size:14px}.trow .s{font-size:12px;color:var(--mute)}
.trow .p{font-weight:800;font-size:16px;text-align:right}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="promo">Price mistakes &amp; extreme sales &middot; updated every 5 min</div>
<header>
  <div class="bar">
    <div class="logo">Deal<span>Radar</span></div>
    <label class="search">&#128269;&nbsp;<input id="q" type="search" placeholder="Search deals" autocomplete="off"></label>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="meta"><div><b id="count">Loading…</b></div><div id="updated"></div></div>
<main id="main"></main>
<div class="toast" id="toast"><span id="toastMsg">Removed</span><button id="undo">UNDO</button></div>

<script>
const CATS=[["all","All"],["glitch","Price mistakes"],["priority","My hunts"],["tech","Tech"],["shoes","Shoes"],["menswear","Menswear"],["household","Home"],["accessories","Accessories"],["everyday","Everyday"],["tracker","Price tracker"],["removed","Removed"]];
const BLOCK=["ebay","adidas"];
let deals=[],tracked={},cat="all",q="",lastRemoved=null,toastT;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let removed=new Set(store.get("dr_removed",[]));
cat=store.get("dr_cat","all");

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ago(iso){if(!iso)return"";const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.round(m/60);if(h<24)return h+"h ago";return Math.round(h/24)+"d ago"}
function money(n){return n==null?"":"$"+(n%1?n.toFixed(2):n.toLocaleString())}
function blocked(d){const s=(d.title+" "+(d.store||"")+" "+(d.url||"")).toLowerCase();return BLOCK.some(b=>s.includes(b))}
function when(d){return d.postedAt||d.foundAt}

function chips(){document.getElementById("chips").innerHTML=CATS.map(([k,l])=>`<button class="chip ${k===cat?"on":""}" data-c="${k}">${l}</button>`).join("")}
document.getElementById("chips").onclick=e=>{const c=e.target.dataset.c;if(!c)return;cat=c;store.set("dr_cat",c);chips();render();window.scrollTo({top:0})};
document.getElementById("q").oninput=e=>{q=e.target.value.toLowerCase().trim();render()};

function visible(){
  let list=deals.filter(d=>!blocked(d));
  if(cat==="removed")list=list.filter(d=>removed.has(d.id));
  else{
    list=list.filter(d=>!removed.has(d.id));
    if(cat==="glitch")list=list.filter(d=>d.tier==="glitch");
    else if(cat==="priority")list=list.filter(d=>d.priority);
    else if(cat!=="all")list=list.filter(d=>d.cat===cat);
  }
  if(q)list=list.filter(d=>(d.title+" "+(d.store||"")+" "+d.source).toLowerCase().includes(q));
  return list.sort((a,b)=>new Date(when(b))-new Date(when(a)));  // newest first
}

function card(d){
  const tier={glitch:"Price mistake",fire:"Hot",good:"Deal"}[d.tier]||"Deal";
  const rm=cat==="removed";
  return `<article class="card" id="c-${d.id}">
    <a href="${esc(d.url)}" target="_blank" rel="noopener">
      <div class="ph">${d.img?`<img loading="lazy" src="${esc(d.img)}" alt="" onerror="this.outerHTML='<span class=noimg>🏷️</span>'">`:`<span class="noimg">🏷️</span>`}</div>
    </a>
    <span class="badge b-${d.tier}">${tier}</span>
    <button class="x" data-id="${d.id}" title="${rm?"Restore":"Remove"}" aria-label="${rm?"Restore":"Remove"}">${rm?"↺":"✕"}</button>
    <a class="body" href="${esc(d.url)}" target="_blank" rel="noopener">
      <div class="store">${esc(d.store||d.source)}</div>
      <div class="title">${esc(d.title)}</div>
      <div class="prices">${d.price?`<span class="now">${money(d.price)}</span>`:""}${d.was?`<span class="was">${money(d.was)}</span>`:""}${d.pct?`<span class="off">-${d.pct}%</span>`:""}</div>
      <div class="foot"><span>${esc(d.source)}</span><span>${ago(when(d))}</span></div>
    </a>
  </article>`;
}

function render(){
  const main=document.getElementById("main");
  if(cat==="tracker")return renderTracker(main);
  const list=visible();
  document.getElementById("count").textContent=`${list.length} ${cat==="removed"?"removed":"deals"}`;
  main.className="grid";
  main.innerHTML=list.length?list.map(card).join(""):`<div class="empty">${cat==="removed"?"Nothing removed.":"No deals here yet. New ones show up every few minutes."}</div>`
    +(cat==="removed"&&list.length?`<div class="empty" style="padding:10px"><button class="link" id="restoreAll">Restore all</button></div>`:"");
}

function renderTracker(main){
  const rows=Object.entries(tracked).filter(([k])=>!k.startsWith("_"));
  document.getElementById("count").textContent=`${rows.length} tracked`;
  main.className="tlist";
  main.innerHTML=rows.map(([url,t])=>{
    const h=t.history||[],first=h[0]?.p,chg=first&&t.last?Math.round((t.last/first-1)*100):0;
    return `<a class="trow" href="${esc(url)}" target="_blank" rel="noopener"><div><div class="n">${esc(t.name)}</div>
      <div class="s">${t.error?esc(t.error):`Low ${money(t.low)} · checked ${ago(t.checkedAt)}`}</div></div>
      <div class="p">${money(t.last)||"—"}${chg?`<div class="s" style="color:${chg<0?"var(--good)":"var(--sale)"}">${chg>0?"+":""}${chg}%</div>`:""}</div></a>`}).join("")
    ||`<div class="empty">Tracked prices appear after the first hourly check.</div>`;
}

document.getElementById("main").addEventListener("click",e=>{
  if(e.target.id==="restoreAll"){removed.clear();store.set("dr_removed",[]);render();return}
  const b=e.target.closest(".x");if(!b)return;
  e.preventDefault();const id=b.dataset.id,el=document.getElementById("c-"+id);
  const restoring=removed.has(id);
  restoring?removed.delete(id):removed.add(id);store.set("dr_removed",[...removed]);
  el.classList.add("gone");setTimeout(render,220);
  if(!restoring){lastRemoved=id;toast("Removed from your list")}
});
function toast(m){const t=document.getElementById("toast");document.getElementById("toastMsg").textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),4000)}
document.getElementById("undo").onclick=()=>{if(lastRemoved){removed.delete(lastRemoved);store.set("dr_removed",[...removed]);lastRemoved=null;render()}document.getElementById("toast").classList.remove("show")};

async function load(){
  try{
    const [a,b]=await Promise.all([fetch("deals.json?"+Date.now()).then(r=>r.json()),fetch("tracked.json?"+Date.now()).then(r=>r.json()).catch(()=>({}))]);
    deals=a.deals||[];tracked=b;
    document.getElementById("updated").textContent="Updated "+ago(a.updatedAt);
  }catch(e){document.getElementById("updated").textContent="Couldn't load deals"}
  render();
}
chips();load();setInterval(load,120000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
