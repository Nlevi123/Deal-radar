name: Deal Radar scan

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's fastest; runs can lag a few minutes at busy times)
  workflow_dispatch: {}      # "Run workflow" button = scan now
  push:
    branches: [main]
    paths: ["scanner.py", "config.json", ".github/workflows/scan.yml"]

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scanner.py
      - name: Save results
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "deal-radar-bot@users.noreply.github.com"
          git add deals.json tracked.json
          git diff --cached --quiet || (git commit -m "scan $(date -u +%H:%M)" && git pull --rebase && git push)
